[project]
name = "tuskr-mcp"
version = "0.2.0"
description = "MCP server for Tuskr: read/search cases, validate setup, filter by automated, read test runs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Rowan Kendal" }]
keywords = ["tuskr", "mcp", "test-management", "cursor", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "mcp>=1.26.0",
    "requests>=2.31.0",
]

[project.urls]
Homepage = "https://github.com/zapkid/tuskr-mcp"
Repository = "https://github.com/zapkid/tuskr-mcp"
Issues = "https://github.com/zapkid/tuskr-mcp/issues"

[project.scripts]
tuskr-mcp = "tuskr_mcp.server:main"

[tool.uv]
package = true

[tool.pyright]
venvPath = "."
venv = ".venv"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tuskr_mcp"]
